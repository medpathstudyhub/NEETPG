<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topic Directory Explorer — MEDPATH STUDY HUB</title><link rel="stylesheet" href="style.css"><style>.topic-shell{max-width:1000px;margin:28px auto;padding:0 18px}.topic-head,.topic-list{background:#fff;border:1px solid #d5e0e8;border-radius:12px;padding:24px;margin-bottom:18px}.topic-list{padding:12px 24px}.topic-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:15px 8px;border-bottom:1px solid #e1e8ee;text-decoration:none;color:#183c63}.topic-row:last-child{border-bottom:0}.topic-row:hover{background:#f6fafb}.topic-row small{color:#627487}.folder{font-size:1.2rem}.backlink{color:#fff}.topic-empty{background:#f5f8fa;padding:18px;border-radius:8px}</style></head><body><header class="masthead"><div class="brand"><div class="brandmark">MP</div><div><div class="eyebrow">MEDPATH STUDY HUB</div><h1>Topic Directory Explorer</h1></div></div><a class="backlink" href="index.html">← Study Hub Home</a></header><main class="topic-shell"><section class="topic-head"><p class="eyebrow" style="color:#168c86">SUBJECT DIRECTORY</p><h2 id="subjectTitle">Loading subject…</h2><p class="muted">Choose a topic to open practice containing questions tagged to that topic.</p></section><section class="topic-list"><div id="topicList">Loading topics…</div></section><p><a href="index.html">← Back to MEDPATH STUDY HUB</a></p></main><script src="questions.js"></script><script src="topics.js"></script><script src="subject-config.js"></script><script>(()=>{const params=new URLSearchParams(location.search),subject=params.get("subject")||"",bank=window.QUESTION_BANK||[];const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"");const rows=bank.filter(q=>norm(q.subject)===norm(subject));const map=new Map();const catalog=window.TOPIC_CATALOG||{};const catKey=Object.keys(catalog).find(k=>norm(k)===norm(subject));(catKey&&Array.isArray(catalog[catKey])?catalog[catKey]:[]).forEach(t=>map.set(String(t).trim(),0));rows.forEach(q=>{const t=String(q.topic||"").trim();if(t)map.set(t,(map.get(t)||0)+1)});document.title=(subject||"Subject")+" Topics — MEDPATH STUDY HUB";document.getElementById("subjectTitle").textContent=(subject?window.medpathSubjectEmoji(subject)+" ":"")+ (subject||"Subject topics");const el=document.getElementById("topicList");if(!subject){el.innerHTML='<p class="topic-empty">No subject was selected. Return to the Study Hub and choose a subject.</p>';return}if(!map.size){location.replace("index2.html?subject="+encodeURIComponent(subject));return}el.innerHTML="";[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true,sensitivity:"base"})).forEach(([topic,count])=>{const a=document.createElement("a");a.className="topic-row";a.href="index2.html?subject="+encodeURIComponent(subject)+"&topic="+encodeURIComponent(topic)+"&mode=topic";a.innerHTML='<span><span class="folder">📁</span> '+topic+'</span><small>'+count+' question'+(count===1?'':'s')+' →</small>';el.appendChild(a)})})();</script></body></html>
