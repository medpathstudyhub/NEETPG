<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEDPATH Study Hub — Admin Login</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172b4d;background:#f2f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,420px);background:#fff;border:1px solid #dce7f0;border-radius:20px;padding:32px;box-shadow:0 18px 50px #17324d12}.brand{text-align:center;margin-bottom:26px}.logo{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 12px;border-radius:16px;background:#e5f4ff;color:#0877b9;font-size:30px}.brand h1{font-size:24px;margin:0 0 6px}.brand p{margin:0;color:#64748b;font-size:14px}label{display:block;font-weight:650;font-size:14px;margin:16px 0 7px}input{width:100%;padding:12px 13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}input:focus{outline:3px solid #d7efff;border-color:#1684c7}button{width:100%;border:0;border-radius:10px;background:#087bb9;color:#fff;padding:13px;font:inherit;font-weight:700;margin-top:22px;cursor:pointer}button:hover{background:#06689d}.error{color:#b42318;font-size:14px;min-height:20px;margin:12px 0 0}.note{font-size:12px;color:#64748b;text-align:center;line-height:1.5;margin-top:22px}
</style>
</head><body>
<main class="card"><header class="brand"><div class="logo" aria-hidden="true">✚</div><h1>MEDPATH STUDY HUB</h1><p>Administrator Login</p></header>
<form id="loginForm"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Log in to Admin</button><p class="error" id="loginError" role="alert"></p></form>
<p class="note">Administrator access page. This simple client-side login is a convenience screen only and does not securely protect a public GitHub Pages site.</p></main>
<script src="passlog.js"></script></body></html>
